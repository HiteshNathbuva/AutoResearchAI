[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearchai"
version = "0.2.0"
description = "Production-style multi-agent AI research platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "frontend", "build", "dist"]

[tool.ruff.lint]
# Deliberately excludes "UP" (pyupgrade): modernizing typing annotations across
# the existing codebase is out of scope for Phase 0.
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
